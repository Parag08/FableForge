openapi: 3.0.3
info:
  title: FableForge Backend API
  version: 0.1.0
  description: |
    Scaffold API for FableForge. Only the endpoints below exist today.
    Login checks a single demo account configured via environment
    variables (DEMO_USERNAME / DEMO_PASSWORD); there is no user storage yet.

servers:
  - url: http://localhost:8080
    description: Local development (port comes from the PORT env var)

paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        '405':
          description: Method not allowed

  /login:
    post:
      summary: Log in with the demo account
      description: |
        On success, sets an HttpOnly `token` cookie containing an HS256 JWT
        whose lifetime is TOKEN_TTL. The response body is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in; JWT set in the `token` cookie
          headers:
            Set-Cookie:
              description: "token=<jwt>; Path=/; HttpOnly; SameSite=Lax"
              schema:
                type: string
        '400':
          description: Request body is not valid JSON
        '401':
          description: Invalid username or password
        '405':
          description: Method not allowed

components:
  schemas:
    Credentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
